name: CI — MTN QuantRisk

on:
  push:
    branches: ["master", "main", "client"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  # ── Backend tests ───────────────────────────────────────────────────────────
  backend-tests:
    name: Backend · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python deps (CPU torch + requirements)
        run: |
          pip install --upgrade pip
          pip install torch==2.3.1+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Run impact + NLP unit tests (no network needed)
        run: |
          cd ..
          pytest tests/test_impact.py tests/test_nlp.py tests/test_scraper.py tests/test_alerts.py -v --tb=short

      - name: Run API integration tests (TestClient, no server needed)
        run: |
          cd ..
          pytest tests/test_api.py -v --tb=short

  # ── Frontend type-check ─────────────────────────────────────────────────────
  frontend-typecheck:
    name: Frontend · TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci --ignore-scripts

      - name: TypeScript type-check
        run: npx tsc --noEmit

  # ── Docker build check ──────────────────────────────────────────────────────
  docker-build:
    name: Docker · build images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-typecheck]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: quantrisk-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: quantrisk-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
